name: Deploy Recauda Backend

on:
  push:
    branches: [ "main" ] # Cambia a 'master' si tu rama se llama así
    paths:
      - 'backend-alcancias/**' # Ajusta la ruta según la ubicación de tu backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/carlos_admin/recauda-app/backend-alcancias
          git pull origin main
          npm ci
          pm2 restart recauda-api